name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: woodshed
          POSTGRES_PASSWORD: woodshed
          POSTGRES_DB: woodshed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woodshed"
          --health-interval 2s
          --health-retries 15
    env:
      # Fail if pyproject.toml changed without an updated uv.lock.
      UV_LOCKED: 1
      TEST_DATABASE_URL: postgresql://woodshed:woodshed@localhost:5432/woodshed_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv no longer publishes floating major tags, so pin the release commit.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint
      - run: make test

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Fail if pyproject.toml changed without an updated uv.lock.
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@v7
      # setup-uv no longer publishes floating major tags, so pin the release commit.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint
      - run: make test

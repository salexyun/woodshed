name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer merge supersedes a queued deploy; a running one finishes its smoke test.
concurrency: dev

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  dev:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
      - name: Deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -o /dev/null -X POST "$HOOK&imgURL=$(jq -rn --arg u "$IMAGE" '$u|@uri')"
      # Render keeps serving the old release until the new one is up, and a free instance
      # can cold-start slowly, so wait until /healthz reports this SHA.
      - name: Smoke test
        timeout-minutes: 10
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          until [ "$(curl -fsS --max-time 30 "$APP_URL/healthz" | jq -r .version)" = "$GITHUB_SHA" ]; do
            sleep 15
          done

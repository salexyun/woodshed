services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://woodshed:woodshed@db:5432/woodshed
      OTEL_SERVICE_NAME: woodshed
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: 10000
      # The healthcheck below polls every 2 s; keep it out of traces and metrics.
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: healthz
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 2s
      retries: 15

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: woodshed
      POSTGRES_PASSWORD: woodshed
      POSTGRES_DB: woodshed
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U woodshed
      interval: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      # Integration tests use their own database so they never touch dev data.
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/create-test-db.sql

  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: --config=/etc/collector.yaml
    volumes:
      - ./observability/collector.yaml:/etc/collector.yaml:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      # Ingests a zero at each counter's start, so increase() counts its first events.
      - --enable-feature=created-timestamp-zero-ingestion
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.10
    # The on-call responder (#27) reads its evidence from Loki and Tempo.
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.10.10
    command: -config.file=/etc/tempo.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:12.4.15
    environment:
      # Local only: open Grafana without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # The on-call responder (#27) runs on the host, next to the repo it fixes.
      RESPONDER_URL: ${RESPONDER_URL:-http://host.docker.internal:8090/alerts}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/woodshed.yaml:ro
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/woodshed.yaml:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./observability/grafana/alerting.yaml:/etc/grafana/provisioning/alerting/woodshed.yaml:ro

configs:
  create-test-db:
    content: CREATE DATABASE woodshed_test;

volumes:
  pgdata:
